<div class="ad-log-host">
<a class="ad-log-row" anvil:name="row">
  <anvil-component type="Label" name="when"></anvil-component>
  <anvil-component type="Label" name="kind"></anvil-component>
  <anvil-component type="Label" name="a" bind:text="self.item['a']"></anvil-component>
  <anvil-component type="Label" name="b" bind:text="self.item['b']"></anvil-component>
  <anvil-component type="Label" name="devices" prop:role='["opt"]'></anvil-component>
  <anvil-component type="Label" name="score"></anvil-component>
  <anvil-component type="Label" name="result"></anvil-component>
  <anvil-component type="Label" name="flags" prop:role='["opt", "fl"]'></anvil-component>
</a>
</div>
