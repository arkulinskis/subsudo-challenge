metadata:
  description: 'Virtual fight club: record a round with your phone or laptop camera, send it as a challenge, climb the global
    and city rankings.'
  logo_img: asset:icon-512.png
  title: Subsudo · Virtual fight club
name: Subsudo
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=f305888437\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#1c1a18\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=8b99759809\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=8b99759809\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: the footer's \"Suggest an idea\" link (data-prepsto-open) slides it in.\
    \ No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n<script src=\"\
    https://prepsto.com/_/theme/widget.js\" data-prepsto=\"z5yjpux\" data-button=\"false\" data-label=\"Suggest an idea\"\
    \ async></script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=55fd2da6d7\">\n<script src=\"_/theme/app.js?v=b38dfec330\"\
    ></script>\n"
package_name: Subsudo
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
