    >\n<meta property=\"og:image\" content=\"https://subsudo.com/_/theme/og-image.png\">\n<meta property=\"og:image:width\"\
    \ content=\"1200\"><meta property=\"og:image:height\" content=\"630\">\n<meta property=\"og:image:alt\" content=\"Subsudo:\
    \ Shadow-box a round, send the challenge, climb the rankings\">\n<meta name=\"twitter:card\" content=\"summary_large_image\"\
    >\n<meta name=\"twitter:title\" content=\"Subsudo: virtual fight club, shadow-box and climb the ranks\">\n<meta name=\"\
    twitter:description\" content=\"Virtual fight club: record a shadow-boxing round with your phone or laptop camera, send\
    \ it as a challenge, and climb the global and city rankings.\">\n<meta name=\"twitter:image\" content=\"https://subsudo.com/_/theme/og-image.png\"\
    >\n<link rel=\"alternate\" type=\"text/plain\" title=\"Subsudo for AI assistants\" href=\"https://subsudo.com/llms.txt\"\
    >\n<script type=\"application/ld+json\">{\"@context\": \"https://schema.org\", \"@graph\": [{\"@type\": \"VideoGame\"\
    , \"@id\": \"https://subsudo.com/#app\", \"name\": \"Subsudo\", \"url\": \"https://subsudo.com/\", \"description\": \"\
    Virtual fight club: record a shadow-boxing round with your phone or laptop camera, send it as a challenge, and climb the\
