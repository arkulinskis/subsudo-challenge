    \ bout\", \"Ratings, belts and world and city rankings\", \"Friend invites that work without an account\"], \"audience\"\
    : {\"@type\": \"Audience\", \"audienceType\": \"Adults who like boxing workouts and friendly competition\"}}, {\"@type\"\
    : \"WebSite\", \"@id\": \"https://subsudo.com/#site\", \"url\": \"https://subsudo.com/\", \"name\": \"Subsudo\", \"publisher\"\
