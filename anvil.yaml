    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "VideoGame", "@id": "https://subsudo.com/#app", "name": "Subsudo", "url": "https://subsudo.com/", "description": "Virtual fight club: record a shadow-boxing round with your phone or laptop camera, send it as a challenge, and climb the global and city rankings.", "image": "https://subsudo.com/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "shadow boxing app, boxing workout game, virtual boxing challenge, punch tracker, boxing rankings, fight club game, cardio boxing at home, motion sensor boxing, hand tracking game", "applicationCategory": "SportsApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript and a modern web browser", "featureList": ["Record a round with a phone in your fist or a laptop camera", "Send sealed call-outs; opponents answer whenever they like", "Three automatic judges score every bout", "Ratings, belts and world and city rankings", "Friend invites that work without an account"], "audience": {"@type": "Audience", "audienceType": "Adults who like boxing workouts and friendly competition"}}, {"@type": "WebSite", "@id": "https://subsudo.com/#site", "url": "https://subsudo.com/", "name": "Subsudo", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
